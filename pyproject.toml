[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubleagent"
version = "0.1.0"
description = "Experimental DoubleAgent provider runtime and Service SDK"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "PyYAML>=6,<7", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "pre-commit>=4,<5"]

[project.scripts]
doubleagent-runtime = "doubleagent.runtime.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
